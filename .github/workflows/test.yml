---
name: test
on:
  pull_request:
  push:
    tags-ignore:
      - v*
jobs:
  test-all:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest and the newest supported python: version-specific
        # breakage lives at the floor, and the tag workflow covers the middle
        python_v: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python_v }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv python install ${{ matrix.python_v }}

      - name: Install Dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get update && sudo apt-get install xvfb
        timeout-minutes: 1
      - name: Install choreographer
        run:  uv sync --no-sources --all-extras --locked
      - name: Install google-chrome-for-testing
        run: uv run --no-sources choreo_get_chrome -v
      - name: Diagnose
        run:  uv run --no-sources choreo_diagnose --no-run
        timeout-minutes: 1

      - name: Test
        if: ${{ ! runner.debug && matrix.os != 'ubuntu-latest' }}
        run: uv run --no-sources poe test
        timeout-minutes: 7

      - name: Test (Linux)
        if: ${{ ! runner.debug && matrix.os == 'ubuntu-latest' }}
        run: xvfb-run uv run --no-sources poe test
        timeout-minutes: 7

      # Linux only: this is the one test that uses chrome's real 100MB buffer
      # rather than a shrunken one, so it is worth running somewhere, but it
      # peaks near 1GB and has been seen to fail once without explanation.
      - name: Test large messages (Linux)
        if: ${{ ! runner.debug && matrix.os == 'ubuntu-latest' }}
        run: xvfb-run uv run --no-sources poe test_slow
        timeout-minutes: 5

      - name: Test (Debug)
        if: ${{ runner.debug && matrix.os != 'ubuntu-latest' }}
        env:
          CHOREO_ENABLE_DEBUG: 1
        run: uv run --no-sources poe debug-test
        timeout-minutes: 20

      - name: Test (Debug, Linux)
        if: ${{ runner.debug && matrix.os == 'ubuntu-latest' }}
        env:
          CHOREO_ENABLE_DEBUG: 1
        run: xvfb-run uv run --no-sources poe debug-test
        timeout-minutes: 7
